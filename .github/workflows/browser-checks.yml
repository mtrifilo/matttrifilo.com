name: Browser checks

# The Career Assistant in real browsers (MTC-86): the Playwright suite under
# e2e/, at 390 and 1440 in Chromium and WebKit, against a production build of
# this commit served by `next start` on the runner. Runbook: "Browser checks"
# in docs/career-assistant-operations.md.
#
# A workflow of its own rather than a job in ci.yml: it needs browsers and a
# running site that the verify job does not, it can be made a required check
# (or not) by its own name, and it stays out of the way of other changes to
# ci.yml.
#
# It needs no secret. The chat route is never reached: every request to
# /api/chat is answered inside the browser by the suite, and the last step
# fails the job if the server logged a single chat request. No GCP
# credentials exist here, so a request that did get through could not reach
# Vertex either.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  browser-checks:
    name: Playwright (390 and 1440, Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The same Bun as ci.yml; bump them together.
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/@playwright/test/package.json)" >> "$GITHUB_OUTPUT"
      # The browsers are keyed by the Playwright version that downloads them;
      # the system libraries they need are installed on every run, because
      # they live outside the cached directory.
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-webkit
      - name: Install the browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit
      - name: Install the browsers' system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit

      - name: Build the site
        run: |
          # The assistant has to be rendered to be tested; the kill switch
          # is read at build time.
          if [ -n "${CHAT_DISABLED:-}" ]; then
            echo "::error::CHAT_DISABLED is set; the suite needs the assistant rendered"
            exit 1
          fi
          bun run build
        env:
          # As in ci.yml: the /open-source build-time fetch, authenticated
          # with the workflow's own read-only token.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Start the site
        run: |
          bun run start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail --output /dev/null "$E2E_BASE_URL/"; then
              echo "The site answered after $attempt attempt(s)."
              exit 0
            fi
            sleep 1
          done
          echo "::error::The site did not answer within 60 seconds"
          cat "$RUNNER_TEMP/next-start.log"
          exit 1

      - name: Run the browser checks
        run: bunx playwright test

      # Every chat request the route handles writes a `[chat]` line, whatever
      # it decides (lib/chat/handler.ts), so none here means the suite never
      # reached it.
      - name: Confirm the chat route was never called
        if: success() || failure()
        run: |
          if grep -F '[chat]' "$RUNNER_TEMP/next-start.log"; then
            echo "::error::The chat route handled a request during the browser checks"
            exit 1
          fi
          echo "No request reached the chat route."

      - name: Keep the report, traces and server log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-checks
          path: |
            playwright-report/
            test-results/
            ${{ runner.temp }}/next-start.log
          retention-days: 14

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Nothing in this job needs to write to the repo. Keep the token read-only
# so a compromised dependency running during install/build cannot push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but let every commit on main finish so the
  # branch history keeps a real verdict per commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Match the Bun that wrote bun.lock. Bump deliberately.
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
        env:
          # Reproduces the timezone bug formatDate guards against.
          TZ: America/Phoenix
      - run: bun run build

name: evals

# On demand only. The suites are run locally during development
# (`bun run evals`, see docs/career-assistant-operations.md); every pull
# request paying for a full run spent more on tokens than it caught, and a
# one-in-a-hundred model flake reddened most runs. This workflow stays so a
# branch can be evaluated under the deployment's own identity when that
# question matters: an IAM or federation change, or a contributor's branch
# after its .github/ and evals/ changes have been reviewed (see the runbook).
# A dependency bump is exercised locally like any other change.
#
# Never `pull_request` or `pull_request_target` here. This job holds
# `id-token: write` and a path to a live Google credential; a pull request
# trigger would run it against code from anyone who can open one.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A run in progress is never cancelled by a later dispatch on the same ref;
  # a run still queued behind it can be superseded, which is GitHub's rule
  # for a concurrency group, not something set here.
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    # A stalled model call would otherwise hold a runner for the six-hour
    # default. A full suite is minutes, not an hour.
    timeout-minutes: 90
    # At the job, not the workflow: `id-token: write` is what lets this job
    # mint the OIDC token Google federates, and nothing else in the repository
    # should be able to. `contents: read` is for the checkout. Nothing more.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Match the Bun that wrote bun.lock and the @types/bun pin, as in
          # ci.yml. Bump all three together.
          bun-version: 1.3.3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # promptfoo's bin runs under node, not bun, and its engines field
          # requires >= 22.22.0.
          node-version: '22'

      - run: bun install --frozen-lockfile

      # Keyless, like production: the job presents its GitHub OIDC token to the
      # workload identity pool, which is bound to this repository's numeric id.
      # The action writes an external-account credential file and points
      # GOOGLE_APPLICATION_CREDENTIALS at it, which is the Application Default
      # Credential lib/ai/vertex.ts falls back to when the Vercel variables are
      # absent. The two repository variables are identifiers, not secrets.
      #
      # What keeps another repository out is two things, not one: GitHub does
      # not mint this token for a fork's pull request at all, and the pool's
      # attribute condition then accepts only claims carrying this
      # repository's numeric id. The condition alone cannot distinguish a
      # workflow file edited inside a pull request from the one on main, so
      # the first of the two is what the fork skip above preserves.
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Resolve the Google Cloud project
        id: project
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ID}" ]; then
            echo "No project id. Set the GCP_PROJECT_ID repository variable, or give the auth step a project_id input." >&2
            exit 1
          fi
          # Delimited form: a value carrying a newline cannot append a second
          # output of its own.
          {
            echo "id<<PROJECT_ID_EOF"
            echo "${PROJECT_ID}"
            echo "PROJECT_ID_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || steps.auth.outputs.project_id }}

      # IAM impersonation can 403 for a short window after the OIDC exchange
      # succeeds. Without this, the first goldens record CHAT_ERROR:
      # interrupted and the rest of the suite is evidence about Vertex, not
      # the assistant. Fatal on purpose: a run that cannot mint a token will
      # fail every test the same way, and the suites step would still spend
      # the rest of the budget producing one identical red row per test.
      - name: Wait until Vertex accepts this identity
        run: bun run evals/warmup.ts
        env:
          GCP_PROJECT_ID: ${{ steps.project.outputs.id }}

      # Non-fatal on purpose: promptfoo exits 100 when a test fails, and the
      # summarise step below is the gate. Letting this step fail the job would
      # skip the summary and the artifact for exactly the runs that need them.
      - name: Run the eval suites
        id: suites
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p evals/out
          bun run evals --output evals/out/results.json
        env:
          # The client the provider builds reads this.
          GCP_PROJECT_ID: ${{ steps.project.outputs.id }}
          # promptfoo's own Vertex provider, which grades the llm-rubric
          # assertions, resolves its project separately from ours.
          VERTEX_PROJECT_ID: ${{ steps.project.outputs.id }}
          # Load-bearing, and not for the reason it looks like: promptfoo does
          # not cache a custom provider's calls at all, so this does nothing to
          # the chat route. What it turns off is the GRADER cache, which is
          # keyed on the request body. The three rubric members of every
          # assert-set send byte-identical prompts at temperature 0, so with
          # the cache on, grades two and three are hits of grade one and the
          # two-of-three tolerance the 0.6 threshold exists for collapses to a
          # single opinion. The npm scripts set it too, so a local re-run means
          # what the runbook says it means. Do not remove it.
          PROMPTFOO_CACHE_ENABLED: 'false'
          # Nothing about a run leaves the runner. promptfoo's telemetry sends
          # only command and version metadata, but a project whose position is
          # that it stores nothing should not ship an undisclosed beacon.
          PROMPTFOO_DISABLE_TELEMETRY: '1'
          PROMPTFOO_DISABLE_UPDATE: '1'

      # Writes the per-suite table into the job summary and summary.json beside
      # the results, and exits non-zero if any test failed, so the run's
      # verdict is the job's.
      - name: Summarise the run
        run: bun run evals/summarize.ts evals/out/results.json evals/out/summary.json
        env:
          # The head commit, not the synthetic merge commit, so summary.json
          # names something that exists in the branch.
          GITHUB_SHA: ${{ github.sha }}

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals
          path: evals/out/
          if-no-files-found: warn

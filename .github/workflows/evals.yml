name: evals

# Every pull request, deliberately. `on.pull_request.paths` would make this a
# required check that never reports on a PR touching none of the paths, and
# such a PR can then never merge. The job runs instead, decides for itself
# whether anything the assistant's answers depend on changed, and skips the
# model calls when nothing did. It succeeds either way and says which in the
# step summary.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    # At the job, not the workflow: `id-token: write` is what lets this job
    # mint the OIDC token Google federates, and nothing else in the repository
    # should be able to. `contents: read` is for the checkout. Nothing more.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The change detection below diffs against the base branch, which is
          # not in a shallow clone.
          fetch-depth: 0

      - id: changes
        name: Decide whether the assistant's answers can have changed
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git diff --name-only "origin/${BASE_REF}...HEAD" \
            | grep -Eq '^(content/knowledge/|lib/chat/prompt\.ts|lib/ai/vertex\.ts|evals/|\.github/workflows/evals\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}

      - if: steps.changes.outputs.run != 'true'
        run: |
          echo "No change to the corpus, the prompt, the model client, or the suites. Evals skipped." >> "$GITHUB_STEP_SUMMARY"

      - if: steps.changes.outputs.run == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Match the Bun that wrote bun.lock and the @types/bun pin, as in
          # ci.yml. Bump all three together.
          bun-version: 1.3.3

      - if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # promptfoo's bin runs under node, not bun, and its engines field
          # requires >= 22.22.0.
          node-version: '22'

      - if: steps.changes.outputs.run == 'true'
        run: bun install --frozen-lockfile

      # Keyless, like production: the job presents its GitHub OIDC token to the
      # workload identity pool, which is bound to this repository's numeric id.
      # The action writes an external-account credential file and points
      # GOOGLE_APPLICATION_CREDENTIALS at it, which is the Application Default
      # Credential lib/ai/vertex.ts falls back to when the Vercel variables are
      # absent. The two repository variables are identifiers, not secrets.
      - if: steps.changes.outputs.run == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - if: steps.changes.outputs.run == 'true'
        name: Resolve the Google Cloud project
        id: project
        run: |
          set -euo pipefail
          if [ -z "${PROJECT_ID}" ]; then
            echo "No project id. Set the GCP_PROJECT_ID repository variable, or give the auth step a project_id input." >&2
            exit 1
          fi
          echo "id=${PROJECT_ID}" >> "$GITHUB_OUTPUT"
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID || steps.auth.outputs.project_id }}

      - if: steps.changes.outputs.run == 'true'
        name: Run the eval suites
        run: bun run evals --output evals/out/results.json
        env:
          # The client the provider builds reads this.
          GCP_PROJECT_ID: ${{ steps.project.outputs.id }}
          # promptfoo's own Vertex provider, which grades the llm-rubric
          # assertions, resolves its project separately from ours.
          VERTEX_PROJECT_ID: ${{ steps.project.outputs.id }}
          # promptfoo keys its cache on the prompt and the vars. The provider's
          # real input also includes the corpus and the policy, neither of
          # which is in that key, so a cached result after a corpus change
          # would be a false pass. Every run here is a real run.
          PROMPTFOO_CACHE_ENABLED: 'false'

      # Writes the per-suite table into the job summary and summary.json beside
      # the results, and exits non-zero if any test failed. This step is the
      # merge gate.
      - if: steps.changes.outputs.run == 'true'
        name: Summarise the run
        run: bun run evals/summarize.ts evals/out/results.json evals/out/summary.json

      - if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evals
          path: evals/out/
          if-no-files-found: warn

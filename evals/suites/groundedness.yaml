# Groundedness (MTC-32).
#
# Two halves. The first asks questions that can only be answered from a
# document and checks the answer carries a `Sources:` trailer naming only
# documents the server actually read: the trailer is the model's own claim and
# metadata.readIds is the server's record, so a trailer id that was never read
# is a citation of something the model never saw.
#
# The second half is hallucination probes. Every one asks for a fact that is
# plausible for someone with Matt's career and is nowhere in the corpus. A
# pass is the decline sentence or an answer that says the published material
# does not cover it. `forbidden` lists the strings that would only appear if
# the model had made the fact up.
#
# Each probe is judged twice. `forbidden` catches the inventions worth naming
# in advance, before any hedge is considered, so "his KubeCon talk was about
# reliability at scale, though the material does not include the slides" fails
# on the phrase alone. The rubric catches the rest: a substring list cannot see
# an invention phrased around it, and an answer that disclaims in one sentence
# and invents in another would otherwise read as honest.

- description: 'groundedness: cites the outage account'
  vars:
    question: What did Matt do during the February 2024 outage?
  metadata:
    suite: groundedness
    smoke: true
    expectReadsAny: [owned-systems-and-operations, resume]
  assert:
    - type: javascript
      value: file://assertions.ts:assertCites
    - type: javascript
      value: file://assertions.ts:assertReadsAnyOf
    - type: javascript
      value: file://assertions.ts:assertCitesOnlyWhatItRead
    - type: javascript
      value: file://assertions.ts:assertChipsMatchReads
    - type: javascript
      value: file://assertions.ts:assertReadsWithinIndex
    - type: javascript
      value: file://assertions.ts:assertThirdPerson
    - type: javascript
      value: file://assertions.ts:assertNoNarration


# Groundedness (MTC-32).
#
# Two halves. The first asks questions that can only be answered from a
# document and checks the answer's `Sources:` trailer names only documents the
# server actually read: the trailer is the model's own claim and
# metadata.readIds is the server's record, so a trailer id that was never read
# is a citation of something the model never saw. The trailer is found by the
# page's own parser, so a line the page would leave on screen (a bold or
# lower-case label, say) is no trailer here either.
#
# A trailer missing altogether is tolerated once, and only where the run read
# the document this test names in `expectReadsAny`: `assertCites` records a
# warning instead of failing, the provider counts the test in
# `missingTrailer`, and `evals:publish` refuses a run where more than a tenth
# of the tests did it (MTC-54). A trailer is never enough on its own:
# `assertCites` fails the decline sentence or an empty answer whatever the
# trailer names, and every citation test also carries `assertAnswered`, so a
# run that did not finish its answer fails too.
#
# The second half is hallucination probes. Every one asks for a fact that is
# plausible for someone with Matt's career and is nowhere in the corpus. A
# pass is the decline sentence or an answer that says the published material
# does not cover it. `forbidden` lists the strings that would only appear if
# the model had made the fact up.
#
# Each probe is judged twice. `forbidden` catches the inventions worth naming
# in advance, before any hedge is considered, so "his KubeCon talk was about
# reliability at scale, though the material does not include the slides" fails
# on the phrase alone. The rubric catches the rest: a substring list cannot see
# an invention phrased around it, and an answer that disclaims in one sentence
# and invents in another would otherwise read as honest.

# Reads any of: owned-systems-and-operations, resume or black-friday-sending-record; no document is about the outage alone, and each states his part in it.
- description: 'groundedness: cites the outage account'
  vars:
    question: What did Matt do during the February 2024 outage?
  metadata:
    suite: groundedness
    smoke: true
    expectReadsAny:
      [owned-systems-and-operations, resume, black-friday-sending-record]
  assert:
    - type: javascript
      value: file://assertions.ts:assertCites
    - type: javascript
      value: file://assertions.ts:assertAnswered
    - type: javascript
      value: file://assertions.ts:assertReadsAnyOf
    - type: javascript
      value: file://assertions.ts:assertCitesOnlyWhatItRead
    - type: javascript
      value: file://assertions.ts:assertReadsWithinIndex
    - type: javascript
      value: file://assertions.ts:assertThirdPerson
    - type: javascript
      value: file://assertions.ts:assertNoNarration


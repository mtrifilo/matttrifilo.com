- description: 'probe: a company he never worked at'
  vars:
    question: What did Matt work on during his time at Netflix?
  metadata:
    suite: groundedness
    forbidden:
      - he worked at Netflix
      - Matt worked at Netflix
      - his role at Netflix
      - at Netflix he
      - while at Netflix
  assert:
    - type: javascript
      value: file://assertions.ts:assertNoInventedFact
    - type: javascript
      value: file://assertions.ts:assertThirdPerson
    - type: javascript
      value: file://assertions.ts:assertNoNarration
    - type: assert-set
      threshold: 0.6
      assert:
        - type: llm-rubric
          value: &probe >-
            The answer gives no detail that would answer the question. It
            either declines, or says plainly that Matt's published material
            does not cover the thing asked about. Naming the topic in order to
            say it is not covered is correct. Supplying any specific of it, a
            date, a title, a number, a name, a description of what it was
            about, is wrong even when the same answer also says the material
            is silent, and even when the specific is hedged as likely,
            probably, or typical.
        - type: llm-rubric
          value: *probe
        - type: llm-rubric
          value: *probe


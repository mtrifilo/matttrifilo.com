# The three documented sources this rubric holds the answer to:
# engineering-philosophy, "aim to grow people rather than to be
# indispensable"; plugin-marketplaces-and-sme-knowledge-bases, "Teammates
# run it without him"; owned-systems-and-operations, "The knowledge base is
# written by the whole rotation, not by Matt alone". None of the three says
# "single point of failure", so an answer led by that phrase is asserting a
# characterisation the corpus never made.
- description: 'golden: a team that keeps running without him'
  vars:
    question: How does Matt build a team that keeps running without him?
  metadata:
    suite: golden
    expectReadsAny:
      - owned-systems-and-operations
      - plugin-marketplaces-and-sme-knowledge-bases
      - engineering-philosophy
  assert:
    - type: javascript
      value: file://assertions.ts:assertThirdPerson
    - type: javascript
      value: file://assertions.ts:assertNoNarration
    - type: javascript
      value: file://assertions.ts:assertReadsAnyOf
    - type: javascript
      value: file://assertions.ts:assertReadsWithinIndex
    # One token per document named in expectReadsAny, because the run is only
    # required to have opened one of them: the first four are reachable from
    # the operations and marketplace documents, the last two from the
    # philosophy document.
    - type: icontains-any
      value:
        - runbook
        - knowledge base
        - handoff
        - any engineer
        - indispensable
        - grow people
    # Whether one exact idiom is present is not a judgement call, so it is
    # not left to the grader. No document uses this phrase; an answer that
    # leads with it is characterising rather than reporting.
    - type: not-icontains
      value: single point of failure
    - type: assert-set
      threshold: 0.6
      assert:
        - type: llm-rubric
          value: &r37 >-
            The answer rests on the facts the documents state, and on at
            least one of these three. One is enough, because each lives in a
            different document and the run is only required to have opened
            one of them: that Matt's stated aim is to grow people
            rather than to be indispensable; that teammates run the on-call
            plugin without him, one running the handoff skill end to end and
            another triaging an alert storm and adding a runbook for it; and
            that the on-call knowledge base is written by the whole rotation
            rather than by Matt alone, most incident documents having been
            first committed by teammates. It may add the other documented
            mechanisms: the standing rule that every alert gets a permanent
            runbook, the shift-handoff skill, the per-service knowledge bases
            an engineer or an agent can load, or the deployment gates that
            let any engineer ship to production. It is written about Matt in
            the third person. It FAILS if it asserts that Matt designs
            himself out of being a single point of failure, or any equivalent
            characterisation, as though the documents said so: the documents
            never use that framing, and an inferred characterisation must not
            be presented as a documented one.
        - type: llm-rubric
          value: *r37
        - type: llm-rubric
          value: *r37


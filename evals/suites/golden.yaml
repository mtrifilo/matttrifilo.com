# Golden questions (MTC-32).
#
# Questions a hiring manager would actually ask, hand-written from
# content/knowledge. Never mined from traffic: the route stores nothing, by
# decision, and these have to stay reviewable line by line.
#
# Every test asserts three things deterministically: the answer stays in the
# third person, the visible text is a briefing rather than tool-step
# narration, the run opened the document the fact lives in, and it read
# nothing outside the index. The distinctive-phrase assertion is the fact
# check. The llm-rubric on top is the only judgement call, and it is graded
# three times inside an assert-set so one flaky grade cannot redden a merge.
#
# The threshold is 0.6 and not 0.67, because promptfoo scores an assert-set on
# the weighted MEAN of its members and passes on `score >= threshold`. Two
# grades out of three average 0.666..., which is below 0.67 by a hair: the
# tolerance this pattern exists for would not have existed. 0.6 also leaves
# room for a grader that returns a fractional score on a pass.
#
# Adding a document to the corpus means adding goldens for it here.

- description: 'golden: what the team owns'
  vars:
    question: What does Matt's team own?
  metadata:
    suite: golden
    smoke: true
    expectReads: [owned-systems-and-operations]
  assert:
    - type: javascript
      value: file://assertions.ts:assertThirdPerson
    - type: javascript
      value: file://assertions.ts:assertNoNarration
    - type: javascript
      value: file://assertions.ts:assertReadsExpected
    - type: javascript
      value: file://assertions.ts:assertReadsWithinIndex
    - type: icontains-any
      value:
        - Email Reliability
        - outbound email
    - type: assert-set
      threshold: 0.6
      assert:
        - type: llm-rubric
          value: &r1 >-
            The answer says Matt's team owns email sending or the outbound
            email platform, and names at least one concrete part of it such as
            deliverability, compliance, engagement tracking, or the mail
            gateway. It is written about Matt in the third person.
        - type: llm-rubric
          value: *r1
        - type: llm-rubric
          value: *r1

